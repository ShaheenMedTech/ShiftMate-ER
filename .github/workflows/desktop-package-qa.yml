name: Desktop package verification

on:
  push:
    branches: [verify/tauri-desktop-packages]

permissions:
  contents: read

jobs:
  publish-tauri:
    name: Build ${{ matrix.platform }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install current linuxdeploy
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS_DIR"

          curl -L \
            --fail \
            --show-error \
            --retry 5 \
            --retry-connrefused \
            -o "$TOOLS_DIR/linuxdeploy-x86_64.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"

          chmod +x "$TOOLS_DIR/linuxdeploy-x86_64.AppImage"

          "$TOOLS_DIR/linuxdeploy-x86_64.AppImage" \
            --appimage-extract-and-run \
            --version

          echo "LINUXDEPLOY_EXCLUDED_LIBRARIES=libwayland-*.so*" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1

      - name: Install and start the DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          sudo apt-get install -y xvfb xdotool "./$deb"
          xvfb-run -a bash -ec 'shiftmate-er & pid=$!; trap "kill $pid || true" EXIT; for i in {1..40}; do xdotool search --onlyvisible --pid "$pid" && exit 0; sleep 1; done; exit 1'

      - name: Install and start the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP ShiftMateQA
          $argsList = "/i `"$($msi.FullName)`" /qn /norestart INSTALLDIR=`"$dir`""
          $install = Start-Process msiexec.exe -ArgumentList $argsList -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI installation failed ($($install.ExitCode))" }
          $exe = Get-ChildItem $dir -Filter shiftmate-er.exe -Recurse | Select-Object -First 1
          $app = Start-Process $exe.FullName -PassThru
          foreach ($i in 1..40) {
            Start-Sleep 1
            $app.Refresh()
            if ($app.HasExited) { throw "Application exited during startup" }
            if ($app.MainWindowHandle -ne 0) { Stop-Process -Id $app.Id; exit 0 }
          }
          throw "No application window appeared"

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftMate-${{ runner.os }}-packages
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
