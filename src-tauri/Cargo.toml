[package]
name = "app"
version = "1.1.0"
description = "Emergency Department shift management and clinical handover application."
authors = ["Dr. Shaheen Ahmed"]
license = "MIT"
repository = "https://github.com/ShaheenMedTech/ShiftMate-ER"
homepage = "https://shaheenmedtech.github.io/ShiftMate-ER/"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
